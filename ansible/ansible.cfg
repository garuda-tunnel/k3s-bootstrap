[defaults]
# Keep command lines (which may carry node data) out of task output.
display_args_to_stdout = False
fact_caching = ansible.builtin.memory
# Only the collections bundled with the pinned `ansible` package; user-level installs must not shadow them.
collections_path =

[ssh_connection]
pipelining = True
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=4

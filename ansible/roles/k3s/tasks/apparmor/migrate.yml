---
# Never unload cri-containerd.apparmor.d: live containers keep its policy
# until reboot; containerd's load-once check will reuse it in the meantime.
- name: Check for the obsolete profile loader unit
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-bootstrap-apparmor.service
    get_checksum: false
  register: k3s_apparmor_old_unit

- name: Disable and stop the obsolete profile loader
  ansible.builtin.systemd_service:
    name: k3s-bootstrap-apparmor.service
    enabled: false
    state: stopped
    daemon_reload: true
  when: k3s_apparmor_old_unit.stat.exists

- name: Remove the v0.3.1 artifacts without unloading their policy
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apparmor.d/cri-containerd.apparmor.d
    - /etc/systemd/system/k3s-bootstrap-apparmor.service
    - "{{ k3s_marker_path | dirname }}/apparmor-loaded"

- name: Reload systemd after removing the obsolete loader
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: k3s_apparmor_old_unit.stat.exists

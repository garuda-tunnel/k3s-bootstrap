---
# The enable path of apparmor/main.yml: the input is on and the kernel
# runs AppArmor with the distro runc file present and validated.

- name: Check for the AppArmor userspace
  ansible.builtin.stat:
    path: /usr/sbin/apparmor_parser
    get_checksum: false
  register: k3s_apparmor_parser

- name: Install the AppArmor userspace
  when: not k3s_apparmor_parser.stat.exists
  ansible.builtin.apt:
    name: apparmor
    state: present
    update_cache: true

- name: Create the module state directory
  # Holds the load stamp below before the node type marker is
  # written; the later creation of the same directory is idempotent.
  ansible.builtin.file:
    path: "{{ k3s_marker_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the extended runc profile
  # validate parses the render before it replaces the file, so an
  # invalid profile never lands on disk (as the firewall role does
  # with nft -c).
  ansible.builtin.template:
    src: apparmor/runc.j2
    dest: "{{ k3s_apparmor_profile }}"
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/apparmor_parser -QTK %s
  register: k3s_apparmor_override

- name: Create the distro profile disable directory
  ansible.builtin.file:
    path: "{{ k3s_apparmor_disable_link | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable the distro file so only our runc definition loads
  ansible.builtin.file:
    src: "{{ k3s_apparmor_distro_profile }}"
    dest: "{{ k3s_apparmor_disable_link }}"
    state: link
    follow: false
  register: k3s_apparmor_distro_disabled

- name: Check for the stamp of the last completed load
  ansible.builtin.stat:
    path: "{{ k3s_apparmor_loaded_stamp }}"
    get_checksum: false
  register: k3s_apparmor_stamp_file

- name: Read the stamp of the last completed load
  ansible.builtin.slurp:
    src: "{{ k3s_apparmor_loaded_stamp }}"
  register: k3s_apparmor_stamp
  when: k3s_apparmor_stamp_file.stat.exists

- name: Look for runc in the loaded kernel policy
  ansible.builtin.find:
    paths: /sys/kernel/security/apparmor/policy/profiles
    patterns: runc.*
    file_type: directory
    recurse: false
  register: k3s_apparmor_loaded_profiles

- name: Note whether the loaded policy must be reconciled
  # Reconcile from host state, not only from this run's template change:
  # an interrupted run can leave our file on disk but stock runc loaded,
  # so a stale stamp or no loaded runc also reloads. Restoring a missing
  # disable marker repairs a possible stock reload. The parser blob hash
  # cannot be compared to the kernel profile sha256, so loaded content
  # itself is not audited.
  ansible.builtin.set_fact:
    k3s_apparmor_load_needed: >-
      {{ not (k3s_apparmor_stamp_file.stat.exists | default(false))
         or (k3s_apparmor_stamp.content | default('') | b64decode | trim)
            != k3s_apparmor_override.checksum
         or k3s_apparmor_distro_disabled is changed
         or k3s_apparmor_override is changed
         or k3s_apparmor_loaded_profiles.matched == 0 }}

- name: Replace the loaded profile in place, before k3s starts
  ansible.builtin.command:
    argv: [/usr/sbin/apparmor_parser, -r, -W, "{{ k3s_apparmor_profile }}"]
  when: k3s_apparmor_load_needed | bool
  changed_when: true

- name: Record the completed load
  # Written only after the reload succeeded, so a failed or
  # interrupted load leaves the stale or absent stamp behind and
  # the next run reconciles again.
  ansible.builtin.copy:
    content: "{{ k3s_apparmor_override.checksum }}\n"
    dest: "{{ k3s_apparmor_loaded_stamp }}"
    owner: root
    group: root
    mode: '0644'
  when: k3s_apparmor_load_needed | bool

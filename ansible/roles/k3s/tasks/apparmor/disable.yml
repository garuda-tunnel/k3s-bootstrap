---
- name: Check for managed runc artifacts and a pending restoration
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - "{{ k3s_apparmor_profile }}"
    - "{{ k3s_apparmor_loaded_stamp }}"
  register: k3s_apparmor_restore_artifacts

- name: Note whether stock policy restoration is pending
  ansible.builtin.set_fact:
    k3s_apparmor_restore_needed: >-
      {{ k3s_apparmor_restore_artifacts.results | selectattr('stat.exists') | list | length > 0 }}

- name: Create the state directory for a pending restoration
  ansible.builtin.file:
    path: "{{ k3s_apparmor_loaded_stamp | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: k3s_apparmor_restore_needed | bool

- name: Record pending stock restoration before removing files
  # Activation may have loaded runc but died before writing its stamp.
  # Persist intent first so rollback is retryable even in that case.
  ansible.builtin.copy:
    content: "restore-stock\n"
    dest: "{{ k3s_apparmor_loaded_stamp }}"
    owner: root
    group: root
    mode: '0644'
  when: k3s_apparmor_restore_needed | bool

- name: Remove the extended runc profile and distro disable marker
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: ["{{ k3s_apparmor_profile }}", "{{ k3s_apparmor_disable_link }}"]
  when: k3s_apparmor_restore_needed | bool

- name: Replace the loaded runc policy with the distro profile
  # Keep the stamp until success so an interrupted rollback is retried.
  # No parser can load policy when the kernel has AppArmor disabled.
  ansible.builtin.command:
    argv: [/usr/sbin/apparmor_parser, -r, "{{ k3s_apparmor_distro_profile }}"]
  when:
    - k3s_apparmor_enabled | bool
    - k3s_apparmor_distro.stat.exists
    - k3s_apparmor_restore_needed | bool
  changed_when: true

- name: Remove the runc load stamp after stock restoration
  ansible.builtin.file:
    path: "{{ k3s_apparmor_loaded_stamp }}"
    state: absent

---
# Token file named by config.yaml on joining nodes (0600 root, CON-009). A
# constant, not an input: the k3s_config denylist keeps token-file module-owned.
k3s_token_file: /etc/rancher/k3s/join-token
# The upstream unit names; preflight refuses a node whose unit disagrees.
k3s_service_name: "{{ 'k3s-agent' if node_type == 'agent' else 'k3s' }}"
k3s_unit: "{{ k3s_service_name }}.service"

# Extend the distro's runc attachment without changing its dpkg conffile.
k3s_apparmor_profile: /etc/apparmor.d/k3s-bootstrap-runc
k3s_apparmor_distro_profile: /etc/apparmor.d/runc
k3s_apparmor_disable_link: /etc/apparmor.d/disable/runc
# Exact distro declaration shared by validation and attachment replacement.
k3s_apparmor_distro_declaration: '(?m)^profile runc /usr/\{bin,sbin\}/runc flags=\(unconfined\) \{$'
# Completed-load file checksum, or restore-stock while rollback is pending.
# Missing/different stamp, changed artifacts or absent kernel policy reload runc.
k3s_apparmor_loaded_stamp: "{{ k3s_marker_path | dirname }}/apparmor-runc-loaded"

---
# Inputs of the role, checked by Ansible on role entry; see README.md for
# what the role does. Render: ansible-doc -t role -r ansible/roles firewall
argument_specs:
  main:
    short_description: Gate the k3s API and etcd ports with an isolated nftables table
    description: See README.md in this role.
    options:
      node_type:
        description: What this node becomes; initial bootstraps the cluster (embedded etcd), server and agent join through head.
        type: str
        required: true
        choices: [initial, server, agent]
      firewall_mode:
        description: managed installs the isolated nftables gate on servers; off touches nothing and refuses an existing module firewall.
        type: str
        required: true
        choices: [managed, 'off']
      api_trusted_cidrs:
        description: CIDRs allowed to reach the API and etcd ports besides loopback and cluster_cidrs.
        type: list
        elements: str
        required: true
      cluster_cidrs:
        description: Pod and service CIDRs the cluster uses, trusted by the managed firewall.
        type: list
        elements: str
        required: true

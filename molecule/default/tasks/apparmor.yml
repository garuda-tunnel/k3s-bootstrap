---
# Dedicated VM only: verify runc policy replacement, boot/reload persistence,
# rollback, interrupted convergence and v0.3.1 migration without unloading.
- name: Inspect the installed runc attachment and loaded policies
  become: true
  delegate_to: "{{ k3sb_instance }}"
  block:
    - name: Read the installed profile
      ansible.builtin.slurp:
        src: "{{ k3sb_apparmor_profile }}"
      register: k3sb_apparmor_profile_raw

    - name: Read the distro conffile
      ansible.builtin.slurp:
        src: /etc/apparmor.d/runc
      register: k3sb_apparmor_stock_raw

    - name: Parse the installed profile without loading it
      ansible.builtin.command:
        argv: [/usr/sbin/apparmor_parser, -QTK, "{{ k3sb_apparmor_profile }}"]
      changed_when: false

    - name: Inspect the distro disable marker
      ansible.builtin.stat:
        path: "{{ k3sb_apparmor_disable_link }}"
        get_checksum: false
      register: k3sb_apparmor_link

    - name: Read the AppArmor boot ordering
      ansible.builtin.command:
        argv: [systemctl, show, apparmor.service, --property=Before, --value]
      changed_when: false
      register: k3sb_apparmor_ordering

    - name: Read the k3s default boot dependencies
      ansible.builtin.command:
        argv: [systemctl, show, k3s.service, --property=After, --value]
      changed_when: false
      register: k3sb_k3s_ordering

    - name: Read the sha256 of the loaded runc policy
      ansible.builtin.command:
        argv: [/bin/sh, -c, "cat /sys/kernel/security/apparmor/policy/profiles/runc.*/sha256"]
      changed_when: false
      register: k3sb_loaded_sha

- name: Assert only the attachment changed and AppArmor precedes k3s
  ansible.builtin.assert:
    that:
      - >-
        (k3sb_apparmor_profile_raw.content | b64decode)
        == (k3sb_apparmor_stock_raw.content | b64decode
            | replace('/usr/{bin,sbin}/runc', '/{usr/{bin,sbin},var/lib/rancher/k3s/data/*/bin}/runc'))
      - k3sb_apparmor_link.stat.islnk
      - k3sb_apparmor_link.stat.lnk_source == '/etc/apparmor.d/runc'
      - k3sb_loaded_sha.stdout | trim | length > 0
      - "'sysinit.target' in k3sb_apparmor_ordering.stdout.split()"
      - "'sysinit.target' in k3sb_k3s_ordering.stdout.split()"

- name: Verify service reload and direct package-style parsing skip the distro file
  become: true
  delegate_to: "{{ k3sb_instance }}"
  block:
    - name: Reload AppArmor as its package does on upgrade
      ansible.builtin.systemd_service:
        name: apparmor.service
        state: reloaded

    - name: Try the direct dh_apparmor parser invocation
      ansible.builtin.command:
        argv: [/usr/sbin/apparmor_parser, -r, -T, -W, /etc/apparmor.d/runc]
      changed_when: false

    - name: Read the runc policy after both reload paths
      ansible.builtin.command:
        argv: [/bin/sh, -c, "cat /sys/kernel/security/apparmor/policy/profiles/runc.*/sha256"]
      changed_when: false
      register: k3sb_reloaded_sha

- name: Assert reload cannot replace our policy with the distro attachment
  ansible.builtin.assert:
    that: k3sb_reloaded_sha.stdout | trim == k3sb_loaded_sha.stdout | trim

- name: Check the restriction on this kernel
  become: true
  delegate_to: "{{ k3sb_instance }}"
  ansible.builtin.command:
    argv: [/usr/sbin/sysctl, -e, -n, kernel.apparmor_restrict_unprivileged_unconfined]
  changed_when: false
  register: k3sb_apparmor_restriction

- name: Prove embedded runc attaches on every kernel
  ansible.builtin.include_tasks: apparmor-pod.yml
  vars:
    k3sb_apparmor_probe_type: Unconfined
    k3sb_apparmor_expected_label: runc (unconfined)

- name: Verify a new RuntimeDefault container has no unconfined stack
  when: k3sb_apparmor_restriction.stdout | trim == '1'
  ansible.builtin.include_tasks: apparmor-pod.yml
  vars:
    k3sb_apparmor_probe_type: RuntimeDefault
    k3sb_apparmor_expected_label: cri-containerd.apparmor.d (enforce)

- name: Verify the standard AppArmor boot path without a converge
  become: true
  delegate_to: "{{ k3sb_instance }}"
  block:
    - name: Reboot once and wait for the k3s service
      ansible.builtin.reboot:
        reboot_timeout: 300
        test_command: systemctl is-active k3s.service

    - name: Wait for the node after reboot
      ansible.builtin.command:
        argv: [k3s, kubectl, wait, --for=condition=Ready, node, --all, --timeout=180s]
      changed_when: false

    - name: Read the boot-loaded runc policy sha256
      ansible.builtin.command:
        argv: [/bin/sh, -c, "cat /sys/kernel/security/apparmor/policy/profiles/runc.*/sha256"]
      changed_when: false
      register: k3sb_boot_sha

    - name: Assert boot loaded exactly the module policy before k3s
      ansible.builtin.assert:
        that: k3sb_boot_sha.stdout | trim == k3sb_loaded_sha.stdout | trim

    - name: Read the live containerd policy baseline after reboot
      ansible.builtin.command:
        argv: [/bin/sh, -c, "cat /sys/kernel/security/apparmor/policy/profiles/cri-containerd.apparmor.d.*/sha256"]
      changed_when: false
      register: k3sb_containerd_sha

- name: Prove embedded runc still attaches after reboot on every kernel
  ansible.builtin.include_tasks: apparmor-pod.yml
  vars:
    k3sb_apparmor_probe_type: Unconfined
    k3sb_apparmor_expected_label: runc (unconfined)

- name: Verify a new RuntimeDefault container is unstacked after reboot
  when: k3sb_apparmor_restriction.stdout | trim == '1'
  ansible.builtin.include_tasks: apparmor-pod.yml
  vars:
    k3sb_apparmor_probe_type: RuntimeDefault
    k3sb_apparmor_expected_label: cri-containerd.apparmor.d (enforce)

- name: Seed the obsolete v0.3.1 artifacts
  become: true
  delegate_to: "{{ k3sb_instance }}"
  block:
    - name: Seed the old profile file and stamp
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: '# obsolete v0.3.1 artifact for the migration test'
        owner: root
        group: root
        mode: '0644'
      loop:
        - /etc/apparmor.d/cri-containerd.apparmor.d
        - /var/lib/k3s-bootstrap/apparmor-loaded

    - name: Seed the obsolete oneshot loader
      # No policy load: migration must remove the unit, not execute it.
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s-bootstrap-apparmor.service
        content: |
          [Unit]
          Description=Obsolete loader migration fixture
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true
          [Install]
          WantedBy=k3s.service
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start the obsolete loader fixture
      ansible.builtin.systemd_service:
        name: k3s-bootstrap-apparmor.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Simulate activation interrupted after loading but before its stamp
      ansible.builtin.file:
        path: /var/lib/k3s-bootstrap/apparmor-runc-loaded
        state: absent

- name: Converge with the fix disabled to migrate and restore stock
  ansible.builtin.include_tasks: ../shared/tasks/apply.yml
  vars:
    k3sb_apply_vars: {apparmor_container_profile_fix: false}

- name: Inspect rollback and migration results
  become: true
  delegate_to: "{{ k3sb_instance }}"
  block:
    - name: Look for all managed and obsolete files
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop:
        - "{{ k3sb_apparmor_profile }}"
        - "{{ k3sb_apparmor_disable_link }}"
        - /var/lib/k3s-bootstrap/apparmor-runc-loaded
        - /var/lib/k3s-bootstrap/apparmor-loaded
        - /etc/apparmor.d/cri-containerd.apparmor.d
        - /etc/systemd/system/k3s-bootstrap-apparmor.service
        - /etc/systemd/system/k3s.service.wants/k3s-bootstrap-apparmor.service
      register: k3sb_apparmor_disabled_files

    - name: Read the stock runc policy sha256
      ansible.builtin.command:
        argv: [/bin/sh, -c, "cat /sys/kernel/security/apparmor/policy/profiles/runc.*/sha256"]
      changed_when: false
      register: k3sb_stock_sha

    - name: Read the live containerd policy after migration
      ansible.builtin.command:
        argv: [/bin/sh, -c, "cat /sys/kernel/security/apparmor/policy/profiles/cri-containerd.apparmor.d.*/sha256"]
      changed_when: false
      register: k3sb_containerd_after_sha

    - name: Read the distro file after rollback
      ansible.builtin.slurp:
        src: /etc/apparmor.d/runc
      register: k3sb_stock_after

- name: Assert stock was restored without altering live container confinement or the conffile
  ansible.builtin.assert:
    that:
      - k3sb_apparmor_disabled_files.results | selectattr('stat.exists') | list | length == 0
      - k3sb_stock_sha.stdout | trim | length > 0
      - k3sb_stock_sha.stdout | trim != k3sb_loaded_sha.stdout | trim
      - k3sb_containerd_after_sha.stdout | trim == k3sb_containerd_sha.stdout | trim
      - k3sb_stock_after.content == k3sb_apparmor_stock_raw.content

- name: Restore the default attachment
  ansible.builtin.include_tasks: ../shared/tasks/apply.yml

- name: Simulate an interrupted load with our file present but stock policy loaded
  become: true
  delegate_to: "{{ k3sb_instance }}"
  block:
    - name: Stage the stock policy under a name not disabled by the marker
      ansible.builtin.copy:
        content: "{{ k3sb_apparmor_stock_raw.content | b64decode }}"
        dest: /var/tmp/k3sb-stock-runc
        owner: root
        group: root
        mode: '0600'

    - name: Load the stock policy over ours without touching our file
      ansible.builtin.command:
        argv: [/usr/sbin/apparmor_parser, -r, -K, /var/tmp/k3sb-stock-runc]
      changed_when: true

    - name: Remove the completed-load stamp
      ansible.builtin.file:
        path: /var/lib/k3s-bootstrap/apparmor-runc-loaded
        state: absent

    - name: Read the policy sha256 before reconciliation
      ansible.builtin.command:
        argv: [/bin/sh, -c, "cat /sys/kernel/security/apparmor/policy/profiles/runc.*/sha256"]
      changed_when: false
      register: k3sb_interrupted_sha
  always:
    - name: Remove the stock policy scratch file
      ansible.builtin.file:
        path: /var/tmp/k3sb-stock-runc
        state: absent

- name: Assert the interrupted rollout really runs stock
  ansible.builtin.assert:
    that: k3sb_interrupted_sha.stdout | trim == k3sb_stock_sha.stdout | trim

- name: Reconcile the interrupted load
  ansible.builtin.include_tasks: ../shared/tasks/apply.yml

- name: Read the reconciled runc policy sha256
  become: true
  delegate_to: "{{ k3sb_instance }}"
  ansible.builtin.command:
    argv: [/bin/sh, -c, "cat /sys/kernel/security/apparmor/policy/profiles/runc.*/sha256"]
  changed_when: false
  register: k3sb_reconciled_sha

- name: Assert exactly our loaded policy was restored
  ansible.builtin.assert:
    that: k3sb_reconciled_sha.stdout | trim == k3sb_loaded_sha.stdout | trim

- name: Simulate rollback interrupted after removing files but before reloading stock
  become: true
  delegate_to: "{{ k3sb_instance }}"
  block:
    - name: Record the pending restoration intent
      ansible.builtin.copy:
        content: "restore-stock\n"
        dest: /var/lib/k3s-bootstrap/apparmor-runc-loaded
        owner: root
        group: root
        mode: '0644'

    - name: Remove the managed files without reloading stock
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["{{ k3sb_apparmor_profile }}", "{{ k3sb_apparmor_disable_link }}"]

- name: Finish the interrupted rollback
  ansible.builtin.include_tasks: ../shared/tasks/apply.yml
  vars:
    k3sb_apply_vars: {apparmor_container_profile_fix: false}

- name: Read the stock runc policy after the interrupted rollback
  become: true
  delegate_to: "{{ k3sb_instance }}"
  ansible.builtin.command:
    argv: [/bin/sh, -c, "cat /sys/kernel/security/apparmor/policy/profiles/runc.*/sha256"]
  changed_when: false
  register: k3sb_rollback_sha

- name: Assert the pending restoration reloaded stock even though the files were already absent
  ansible.builtin.assert:
    that: k3sb_rollback_sha.stdout | trim == k3sb_stock_sha.stdout | trim

- name: Restore the default attachment before the disabled-kernel test
  ansible.builtin.include_tasks: ../shared/tasks/apply.yml

- name: Converge with AppArmor reporting disabled
  # Dedicated VM only: shadow the parameter, not the real kernel policy.
  block:
    - name: Write a disabled AppArmor parameter
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.copy:
        dest: /var/tmp/k3sb-apparmor-enabled
        content: "N\n"
        owner: root
        group: root
        mode: '0644'

    - name: Shadow the kernel AppArmor enablement parameter
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.command:
        argv: [mount, --bind, /var/tmp/k3sb-apparmor-enabled, /sys/module/apparmor/parameters/enabled]
      changed_when: true

    - name: Apply with AppArmor reporting disabled
      ansible.builtin.include_tasks: ../shared/tasks/apply.yml

    - name: Look for the module profile and disable marker
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop: ["{{ k3sb_apparmor_profile }}", "{{ k3sb_apparmor_disable_link }}"]
      register: k3sb_apparmor_gate_files

    - name: Assert AppArmor off removes our files
      ansible.builtin.assert:
        that: k3sb_apparmor_gate_files.results | selectattr('stat.exists') | list | length == 0
  always:
    - name: Restore the real AppArmor parameter view
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.command:
        argv: [umount, /sys/module/apparmor/parameters/enabled]
      changed_when: false

    - name: Remove the enablement scratch file
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.file:
        path: /var/tmp/k3sb-apparmor-enabled
        state: absent

- name: Restore the default attachment after the disabled-kernel test
  ansible.builtin.include_tasks: ../shared/tasks/apply.yml

- name: Verify restricted kernels refuse a missing distro policy
  when: k3sb_apparmor_restriction.stdout | trim == '1'
  block:
    - name: Remove the distro policy on this dedicated VM
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.file:
        path: /etc/apparmor.d/runc
        state: absent

    - name: Require refusal before k3s can start with a missing stock policy
      ansible.builtin.include_tasks: ../shared/tasks/reject.yml
      vars:
        k3sb_variant_vars: {}
        k3sb_reject_task: 'k3s : Refuse restricted unconfined without a distro runc profile'

  always:
    - name: Restore the distro conffile byte for byte
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.copy:
        content: "{{ k3sb_apparmor_stock_raw.content | b64decode }}"
        dest: /etc/apparmor.d/runc
        owner: root
        group: root
        mode: '0644'

- name: Verify an unchanged final converge is a no-op
  ansible.builtin.include_tasks: ../shared/tasks/apply.yml

- name: Assert the final attachment converge reports no change
  ansible.builtin.assert:
    that: k3sb_run is not changed

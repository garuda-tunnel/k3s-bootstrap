---
- name: Verify the etcd install, kubeconfig access and restart survival
  hosts: all
  gather_facts: false
  become: true
  vars_files: [../shared/vars/module_vars.yml]
  tasks:
    - name: Create the protected datastore marker
      # Any silent reset of the k3s data wipes it, which the snapshots catch.
      # Rendered client-side and applied, so a rerun needs no error matching.
      ansible.builtin.shell: |
        set -euo pipefail
        k3s kubectl create configmap k3sb-safety-marker --from-literal=value=protected \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: true

    - name: Inspect the datastore, the config, the token and the marker
      # The token is generated by k3s: it exists, is private, and no config
      # key or file of the module carries one. Only metadata is read.
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: true
        get_checksum: false
      loop:
        - /var/lib/rancher/k3s/server/db/etcd
        - /var/lib/rancher/k3s/server/db/state.db
        - /etc/rancher/k3s/config.yaml
        - /var/lib/rancher/k3s/server/token
      register: k3sb_install_files

    - name: Read the module marker
      ansible.builtin.slurp:
        src: /var/lib/k3s-bootstrap/installed
      register: k3sb_install_marker

    - name: Assert the datastore is embedded etcd and the config is module-owned
      vars:
        k3sb_st: "{{ k3sb_install_files.results | map(attribute='stat') | list }}"
      ansible.builtin.assert:
        that:
          - k3sb_st[0].isdir | default(false)
          - not k3sb_st[1].exists
          - k3sb_st[2].mode == '0600' and k3sb_st[2].pw_name == 'root'
          - k3sb_st[3].mode == '0600' and k3sb_st[3].pw_name == 'root'
          - (k3sb_install_marker.content | b64decode) == 'initial\n'

    - name: Read the module k3s config
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: k3sb_config_raw
      no_log: true

    - name: Decode the module k3s config
      ansible.builtin.set_fact:
        k3sb_config: "{{ k3sb_config_raw.content | b64decode | from_yaml }}"
      no_log: true

    - name: Assert the config has no token key and initializes etcd
      ansible.builtin.assert:
        that:
          - k3sb_config.keys() | select('search', 'token') | list | length == 0
          - k3sb_config['cluster-init'] is true
      no_log: true

    - name: Assert the kubeconfig carries the login user's real primary group
      ansible.builtin.shell: |
        set -eu
        test "$(id -gn ops)" = admins
        test "$(stat -c '%a %U %G' /etc/rancher/k3s/k3s.yaml)" = '640 root admins'
      changed_when: false

    - name: Assert the config directory lets only the kubeconfig group traverse it
      ansible.builtin.command: stat -c '%a %U %G' /etc/rancher/k3s
      changed_when: false
      register: k3sb_dir_stat
      failed_when: k3sb_dir_stat.stdout != '710 root admins'

    - name: Read the node list with the kubeconfig as the SSH user
      # The group-access proof: ops reaches k3s.yaml through the 0710
      # directory and the 0640 group read bit.
      ansible.builtin.command:
        argv: [runuser, -u, ops, --, k3s, kubectl, --kubeconfig, /etc/rancher/k3s/k3s.yaml, get, nodes]
      changed_when: false

    - name: Try to read the secrets and list the directory as the SSH user
      ansible.builtin.command: "runuser -u ops -- {{ item }}"
      loop:
        - cat /etc/rancher/k3s/config.yaml
        - ls /etc/rancher/k3s
      changed_when: false
      failed_when: false
      register: k3sb_ops_reads

    - name: Assert the SSH user cannot read config.yaml or list the directory
      ansible.builtin.assert:
        that:
          - k3sb_ops_reads.results | map(attribute='rc') | map('int') | select('equalto', 0) | list | length == 0

    - name: Restart k3s so it regenerates the kubeconfig
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted

    - name: Wait for the node to be Ready after the restart
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false

    - name: Inspect the kubeconfig and the datastore after the restart
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop: [/etc/rancher/k3s/k3s.yaml, /var/lib/rancher/k3s/server/db/etcd]
      register: k3sb_restart_files

    - name: Read the safety marker after the restart
      ansible.builtin.command:
        argv: [k3s, kubectl, get, configmap, k3sb-safety-marker, -o, "jsonpath={.data.value}"]
      changed_when: false
      register: k3sb_restart_marker

    - name: Assert the kubeconfig group, datastore and data survive the restart
      vars:
        k3sb_kubeconfig: "{{ k3sb_restart_files.results[0].stat }}"
      ansible.builtin.assert:
        that:
          - k3sb_kubeconfig.mode == '0640'
          - k3sb_kubeconfig.pw_name == 'root'
          - k3sb_kubeconfig.gr_name == 'admins'
          - k3sb_restart_files.results[1].stat.isdir | default(false)
          - k3sb_restart_marker.stdout == 'protected'

- name: Verify no-op reconverge, config change and bounded failure
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [../shared/vars/module_vars.yml]
  vars:
    k3sb_instance: "{{ groups['all'] | first }}"
    k3sb_failure_readiness_seconds: 30
    # Outside the readiness deadline (the poll stops at it on the wall
    # clock): the restart request, the last probe and the journal read.
    k3sb_failure_slack_seconds: 30
  tasks:
    - name: Snapshot before an unchanged reconverge
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        k3sb_snapshot_name: k3sb_unchanged_before

    - name: Record the unchanged reconverge wall-clock start
      ansible.builtin.command: date +%s
      changed_when: false
      register: k3sb_baseline_started_at

    - name: Reconverge once with unchanged inputs
      ansible.builtin.include_tasks: ../shared/tasks/apply.yml

    - name: Record the unchanged reconverge wall-clock end
      ansible.builtin.command: date +%s
      changed_when: false
      register: k3sb_baseline_finished_at

    - name: Snapshot after the unchanged reconverge
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        k3sb_snapshot_name: k3sb_unchanged_after

    - name: Assert an unchanged reconverge neither restarts nor reinstalls nor reports a change
      ansible.builtin.assert:
        that:
          - k3sb_unchanged_after == k3sb_unchanged_before
          - k3sb_run is not changed

    - name: Record the invocation before a matching manual config change
      become: true
      delegate_to: "{{ k3sb_instance }}"
      community.general.systemd_info:
        unitname: [k3s.service]
        extra_properties: [InvocationID]
      register: k3sb_manual_config_invocation_before

    - name: Read the current config for the matching manual change
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: k3sb_manual_config_raw
      no_log: true

    - name: Decode the current config for the matching manual change
      ansible.builtin.set_fact:
        k3sb_manual_config_values: "{{ k3sb_manual_config_raw.content | b64decode | from_yaml }}"
      no_log: true

    - name: Build a config matching the next module inputs
      ansible.builtin.set_fact:
        k3sb_manual_config: >-
          {{ {'disable': ['traefik']} | combine({
               'tls-san': k3sb_manual_config_values['tls-san'],
               'write-kubeconfig-mode': k3sb_manual_config_values['write-kubeconfig-mode'],
               'write-kubeconfig-group': k3sb_manual_config_values['write-kubeconfig-group'],
               'cluster-init': k3sb_manual_config_values['cluster-init']
             }) | to_nice_yaml(indent=2) }}
      no_log: true

    - name: Write a matching changed config without restarting k3s
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.copy:
        content: "{{ k3sb_manual_config }}"
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'
      diff: false
      no_log: true

    - name: Confirm the manual config write did not restart k3s
      become: true
      delegate_to: "{{ k3sb_instance }}"
      community.general.systemd_info:
        unitname: [k3s.service]
        extra_properties: [InvocationID]
      register: k3sb_manual_config_invocation_written

    - name: Assert the manual config write left the invocation unchanged
      ansible.builtin.assert:
        that: >-
          k3sb_manual_config_invocation_written.units['k3s.service'].invocationid
          == k3sb_manual_config_invocation_before.units['k3s.service'].invocationid

    - name: Reapply the matching manual config inputs
      ansible.builtin.include_tasks: ../shared/tasks/apply.yml
      vars:
        k3sb_apply_vars: {k3s_config: {disable: [traefik]}}

    - name: Record the invocation after reapplying matching inputs
      become: true
      delegate_to: "{{ k3sb_instance }}"
      community.general.systemd_info:
        unitname: [k3s.service]
        extra_properties: [InvocationID]
      register: k3sb_manual_config_invocation_after

    - name: Assert matching inputs restarted k3s after the manual config change
      ansible.builtin.assert:
        that: >-
          k3sb_manual_config_invocation_after.units['k3s.service'].invocationid
          != k3sb_manual_config_invocation_before.units['k3s.service'].invocationid

    - name: Snapshot before a config change
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        k3sb_snapshot_name: k3sb_config_before

    - name: Hold k3s in activating, as an agent stuck on a rejected token is
      # A one-shot ExecStartPre waits while /run/k3sb-hold exists and removes
      # it, so only a new invocation (a restart) gets past it. A start request
      # leaves an activating unit alone: the reconverge below then fails at its
      # deadline instead of applying the config change.
      become: true
      delegate_to: "{{ k3sb_instance }}"
      block:
        - name: Create the k3s drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/k3s.service.d
            state: directory
            mode: '0755'

        - name: Install the one-shot hold drop-in
          ansible.builtin.copy:
            dest: /etc/systemd/system/k3s.service.d/k3sb-hold.conf
            content: |
              [Service]
              ExecStartPre=/bin/sh -c 'if [ -e /run/k3sb-hold ]; then rm /run/k3sb-hold; while :; do sleep 1; done; fi'
            mode: '0644'

        - name: Create the hold file
          ansible.builtin.copy:
            dest: /run/k3sb-hold
            content: ''
            mode: '0644'

        - name: Restart k3s into the hold
          ansible.builtin.systemd_service:
            name: k3s.service
            state: restarted
            daemon_reload: true
            no_block: true

        - name: Wait until k3s is activating in the hold
          community.general.systemd_info:
            unitname: [k3s.service]
          register: k3sb_held
          until: k3sb_held.units['k3s.service'].activestate == 'activating'
          retries: 30
          delay: 2

    - name: Reconverge with a different config change
      ansible.builtin.include_tasks: ../shared/tasks/apply.yml
      vars:
        k3sb_apply_vars: {k3s_config: {disable: [servicelb]}}

    - name: Remove the hold drop-in
      become: true
      delegate_to: "{{ k3sb_instance }}"
      block:
        - name: Delete the hold drop-in
          ansible.builtin.file:
            path: /etc/systemd/system/k3s.service.d/k3sb-hold.conf
            state: absent

        - name: Reload systemd without the hold
          ansible.builtin.systemd_service:
            daemon_reload: true

    - name: Snapshot after the config change
      ansible.builtin.include_tasks: tasks/snapshot.yml
      vars:
        k3sb_snapshot_name: k3sb_config_after

    - name: Assert the config change restarted the held k3s without reinstalling it
      ansible.builtin.assert:
        that:
          - k3sb_config_after.config != k3sb_config_before.config
          - k3sb_config_after.active_since != k3sb_config_before.active_since
          - k3sb_config_after.datastore_inode == k3sb_config_before.datastore_inode
          - k3sb_config_after.binary_mtime == k3sb_config_before.binary_mtime
          - k3sb_config_after.installer_mtime == k3sb_config_before.installer_mtime
          - k3sb_config_after.safety_marker == k3sb_config_before.safety_marker

    - name: Remove the module marker to see when it is written
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.file:
        path: /var/lib/k3s-bootstrap/installed
        state: absent

    - name: Record the failing apply wall-clock start
      ansible.builtin.command: date +%s
      changed_when: false
      register: k3sb_failure_started_at

    - name: Apply a config that makes the unit exit on every start
      # An unknown kube-apiserver flag makes k3s exit while it starts the API
      # server, before it can signal readiness, so the unit never reaches
      # ActiveState=active and the bounded wait gives up. (A data-dir here
      # would be refused by preflight on the restoring run.)
      ansible.builtin.include_tasks: ../shared/tasks/apply.yml
      vars:
        k3sb_apply_vars:
          k3s_config: {kube-apiserver-arg: [k3sb-no-such-flag=1]}
          readiness_timeout: 30s
        k3sb_apply_may_fail: true

    - name: Record the failing apply wall-clock end
      ansible.builtin.command: date +%s
      changed_when: false
      register: k3sb_failure_finished_at

    - name: Look for the marker after the failed run
      become: true
      delegate_to: "{{ k3sb_instance }}"
      ansible.builtin.stat:
        path: /var/lib/k3s-bootstrap/installed
        get_checksum: false
      register: k3sb_marker_after_failure

    - name: Show the unchanged and failing apply times
      ansible.builtin.debug:
        msg: >-
          unchanged={{ k3sb_baseline_finished_at.stdout | int - k3sb_baseline_started_at.stdout | int }}s;
          failing={{ k3sb_failure_finished_at.stdout | int - k3sb_failure_started_at.stdout | int }}s;
          excess={{ (k3sb_failure_finished_at.stdout | int - k3sb_failure_started_at.stdout | int)
                    - (k3sb_baseline_finished_at.stdout | int - k3sb_baseline_started_at.stdout | int) }}s

    - name: Assert the run failed in bounded time with the journal tail and wrote no marker
      # Checked unconditionally: a run that unexpectedly succeeds fails here.
      ansible.builtin.assert:
        that:
          - k3sb_run.rc != 0
          - >-
            k3sb_run.stdout is regex(
              'TASK \\[k3s : Fail with the journal tail when k3s never became active\\]'
              ~ '[^\\n]*\\n(?:(?!TASK \\[)[\\s\\S])*?fatal:')
          - not k3sb_marker_after_failure.stat.exists
          - >-
            (k3sb_failure_finished_at.stdout | int - k3sb_failure_started_at.stdout | int)
            - (k3sb_baseline_finished_at.stdout | int - k3sb_baseline_started_at.stdout | int)
            < k3sb_failure_readiness_seconds + k3sb_failure_slack_seconds

    - name: Restore the working config by re-applying the normal variables
      ansible.builtin.include_tasks: ../shared/tasks/apply.yml

    - name: Read the k3s unit and the marker after the restore
      become: true
      delegate_to: "{{ k3sb_instance }}"
      block:
        - name: Read the k3s unit state after the restore
          community.general.systemd_info:
            unitname: [k3s.service]
          register: k3sb_restored_unit

        - name: Read the marker after the restore
          ansible.builtin.slurp:
            src: /var/lib/k3s-bootstrap/installed
          register: k3sb_restored_marker

    - name: Assert k3s is active again and the marker is back
      ansible.builtin.assert:
        that:
          - k3sb_restored_unit.units['k3s.service'].activestate == 'active'
          - (k3sb_restored_marker.content | b64decode) == 'initial\n'

    - name: Check the readiness negatives
      ansible.builtin.include_tasks: tasks/readiness.yml

- name: Verify the embedded runc AppArmor attachment
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [../shared/vars/module_vars.yml]
  vars:
    k3sb_instance: "{{ groups['all'] | first }}"
    k3sb_apparmor_profile: /etc/apparmor.d/k3s-bootstrap-runc
    k3sb_apparmor_disable_link: /etc/apparmor.d/disable/runc
  tasks:
    - name: Check the embedded runc AppArmor attachment end to end
      ansible.builtin.include_tasks: tasks/apparmor.yml
